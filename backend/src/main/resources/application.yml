spring:
  application:
    name: poke-letter
  # 기본값은 루트 compose.yaml의 로컬 DB와 맞춘다. 운영 값은 환경 변수로 주입한다.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pokeletter}
    username: ${DB_USERNAME:pokeletter}
    password: ${DB_PASSWORD:pokeletter}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 마이그레이션으로만 변경한다
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
