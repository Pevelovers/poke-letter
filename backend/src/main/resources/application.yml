spring:
  application:
    name: poke-letter
  # 기본값은 루트 compose.yaml의 로컬 DB와 맞춘다. 운영 값은 환경 변수로 주입한다.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pokeletter}
    username: ${DB_USERNAME:pokeletter}
    password: ${DB_PASSWORD:pokeletter}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 마이그레이션으로만 변경한다
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  # OAuth 로그인 (POL-ACC-01). 키는 환경 변수로만 넣는다 (POL-OPS-04).
  # 기본값 local-placeholder는 키 없이도 앱과 테스트가 뜨게 하는 자리표시 값이다. 실제 로그인은 되지 않는다.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-placeholder}
            # openid만 요청한다. 지정하지 않으면 profile, email까지 요청한다 (POL-PRV-01)
            scope: openid
          kakao:
            # 카카오는 REST API 키가 client-id다
            client-id: ${KAKAO_CLIENT_ID:local-placeholder}
            client-secret: ${KAKAO_CLIENT_SECRET:local-placeholder}
            client-name: Kakao
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          naver:
            client-id: ${NAVER_CLIENT_ID:local-placeholder}
            client-secret: ${NAVER_CLIENT_SECRET:local-placeholder}
            client-name: Naver
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  port: 8080
  # 리버스 프록시 뒤에서 https 콜백 주소를 만들기 위해 X-Forwarded-* 헤더를 쓴다
  forward-headers-strategy: framework
  servlet:
    session:
      # 로그인 유지 30일 (POL-ACC-03). 세션은 서버 메모리에 있어 재배포하면 풀린다
      timeout: 30d
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

pokeletter:
  auth:
    # 켜진 로그인 제공자 (POL-ACC-02). 네이버는 검수 후 켠다
    enabled-providers: ${LOGIN_PROVIDERS:google,kakao}
    # 로그인 성공·실패 후 이동할 FE 경로
    success-url: ${LOGIN_SUCCESS_URL:/me}
    failure-url: ${LOGIN_FAILURE_URL:/?loginError=true}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
