# 공용 개발 프로필 (커밋됨). 실행: ./gradlew bootRun --args='--spring.profiles.active=dev'
# 개발용 로그인(POST /dev/login)은 이 프로필에서만 존재한다. 운영에서는 쓰지 않는다.
# 개인 설정은 커밋되지 않는 application-local.yml에 둔다 (dev,local 함께 켜기)
spring:
  config:
    # backend/.env의 OAuth 키를 읽는다 (없으면 건너뛴다). .env는 .gitignore 대상이다
    # 견본: backend/.env.example
    import: optional:file:.env[.properties]

server:
  servlet:
    session:
      cookie:
        # http://localhost에서도 세션 쿠키가 저장되도록 Secure를 끈다
        secure: false

pokeletter:
  auth:
    # FE 없이 8080에서 확인할 때 로그인 결과를 바로 볼 수 있도록 내 정보 API로 보낸다
    success-url: /api/v1/me
